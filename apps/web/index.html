<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Text follows the system's text size where the browser offers it: sizes are in rem (styles/tokens.css). -->
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>toodoo</title>
    <!-- Both themes, so the canvas and scrollbars start in the right one; a chosen theme narrows it before first
         paint (lib/theme.ts keeps it live). -->
    <meta name="color-scheme" content="light dark" />
    <script>try{var t=localStorage.getItem("toodoo.theme");if(t==="light"||t==="dark"){document.documentElement.dataset.theme=t;document.querySelector('meta[name="color-scheme"]').content=t}}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
